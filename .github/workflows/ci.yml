name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version
      - name: Unit and file operation tests
        run: >-
          xcodebuild -project winfinder.xcodeproj -scheme winfinder
          -derivedDataPath "$RUNNER_TEMP/winfinder-build"
          -destination 'platform=macOS'
          -resultBundlePath "$RUNNER_TEMP/winfinder-tests.xcresult"
          CODE_SIGNING_ALLOWED=NO test
      - name: Universal Release build
        run: >-
          xcodebuild -project winfinder.xcodeproj -scheme winfinder
          -configuration Release -derivedDataPath "$RUNNER_TEMP/winfinder-build"
          CODE_SIGNING_ALLOWED=NO ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO build
      - name: Verify minimum OS and embedded framework architectures
        run: >-
          python3 scripts/check_macos_compatibility.py
          "$RUNNER_TEMP/winfinder-build/Build/Products/Release/Win Finder.app"
